name: Verify starter templates

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generator:
    name: Generator CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate template manifests
        run: node scripts/validate-template-manifests.mjs
      - name: Run generator tests
        run: node --test packages/cli/test/*.test.js

  generated-projects:
    name: Generated ${{ matrix.backend }} and ${{ matrix.frontend }} starter
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fastapi
            frontend: nextjs
            api_port: 8000
          - backend: fastapi
            frontend: react-router
            api_port: 8000
          - backend: nestjs
            frontend: nextjs
            api_port: 3001
          - backend: nestjs
            frontend: react-router
            api_port: 3001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate selected combination
        run: >-
          node packages/cli/bin/create-my-saas.js
          "$RUNNER_TEMP/${{ matrix.backend }}-${{ matrix.frontend }}"
          --backend "${{ matrix.backend }}" --frontend "${{ matrix.frontend }}"
      - name: Verify generated metadata and proxy target
        run: |
          project="$RUNNER_TEMP/${{ matrix.backend }}-${{ matrix.frontend }}"
          test -f "$project/.create-my-saas.json"
          grep -Fx "API_PROXY_TARGET=http://localhost:${{ matrix.api_port }}" "$project/frontend/.env.example"

  generated-static-site:
    name: Generated Astro site and FastAPI API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate Astro frontend with a compatible API
        run: >-
          node packages/cli/bin/create-my-saas.js
          "$RUNNER_TEMP/astro-fastapi-site" --backend fastapi --frontend astro
      - name: Verify generated Astro project configuration
        run: |
          project="$RUNNER_TEMP/astro-fastapi-site"
          test -f "$project/.create-my-saas.json"
          grep -Fx "PUBLIC_SITE_URL=https://example.com" "$project/frontend/.env.example"
          test -f "$project/frontend/src/pages/index.astro"
          test -f "$project/backend/main.py"

  generated-project-e2e:
    name: Generated ${{ matrix.backend }} + ${{ matrix.frontend }} HTTP contract E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fastapi
            frontend: nextjs
          - backend: fastapi
            frontend: react-router
          - backend: fastapi
            frontend: astro
          - backend: nestjs
            frontend: nextjs
          - backend: nestjs
            frontend: react-router
          - backend: nestjs
            frontend: astro
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Generate, install, boot, and exercise the HTTP contract
        run: >-
          node scripts/e2e-generated-projects.mjs
          --backend "${{ matrix.backend }}" --frontend "${{ matrix.frontend }}"

  generated-project-browser-e2e:
    name: Generated ${{ matrix.backend }} + ${{ matrix.frontend }} Playwright E2E
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: fastapi
            frontend: nextjs
          - backend: nestjs
            frontend: react-router
          - backend: fastify
            frontend: astro
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - name: Install the Playwright test runner
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and its system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Exercise the generated project in Chromium
        run: pnpm run test:e2e:browser
        env:
          E2E_BACKEND: ${{ matrix.backend }}
          E2E_FRONTEND: ${{ matrix.frontend }}
      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.backend }}-${{ matrix.frontend }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  nestjs:
    name: NestJS starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/nestjs-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nestjs_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nestjs_starter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nestjs_starter
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
      POSTGRES_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit -p tsconfig.json
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js --runInBand
      - run: pnpm run migration:run
      - run: node --experimental-vm-modules node_modules/jest/bin/jest.js --config ./test/jest-e2e.json --runInBand

  fastapi:
    name: FastAPI starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/fastapi-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: app
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/app
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
      POSTGRES_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - run: uv run alembic upgrade head
      - run: uv run python -m unittest discover -s tests

  nextjs:
    name: Next.js starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/nextjs-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  react-router:
    name: React Router starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/react-router-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build

  astro:
    name: Astro starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/frontend/astro-starter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build

  fastify:
    name: Fastify starter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: templates/backend/fastify-starter
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fastify_starter
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fastify_starter"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fastify_starter
      FRONTEND_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      SECRET_KEY: ci-only-secret-that-is-long-enough-for-validation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run db:migrate
      - run: pnpm run test
